<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomSphere – Landlord</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>RoomSphere</h1><nav><a href="#" onclick="signOut();location.href='login.html'">Log out</a></nav></header>
  <section>
    <h2>Landlord dashboard</h2>
    <p id="who"></p>
    <h3>Listings</h3><p>Coming soon (sample data).</p>
    <h3>Applications</h3><p>Coming soon (sample data).</p>
    <h3>Maintenance requests</h3><p>Coming soon (sample data).</p>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    requireLogin((groups) => {
      if (!groups.includes('landlord')) { window.location.href = 'customer.html'; return; }
      document.getElementById('who').textContent = 'Signed in as landlord.';
    });
  </script>
</body>
</html>
